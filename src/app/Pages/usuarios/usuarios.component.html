<div class="page-title">👤 Usuarios</div>

<div class="alerta" *ngIf="mensaje" [class.alerta-error]="esError" [class.alerta-ok]="!esError">{{ mensaje }}</div>

<div class="panel">
  <div class="panel-header">
    <h2>Gestión de Usuarios</h2>
    <button class="btn btn-dark" (click)="abrirNuevo()">＋ Nuevo Usuario</button>
  </div>

  <table class="tabla">
    <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th>Registrado por</th><th style="text-align:right">Acciones</th></tr></thead>
    <tbody>
      <tr *ngIf="!usuarios.length"><td class="vacio" colspan="6">No hay usuarios</td></tr>
      <tr *ngFor="let u of usuarios">
        <td><strong>{{ u.nombre }}</strong></td>
        <td>{{ u.email }}</td>
        <td><span class="badge badge-info">{{ u.rol?.nombre || '—' }}</span></td>
        <td><span class="badge" [class.badge-success]="u.activo" [class.badge-muted]="!u.activo">{{ u.activo ? 'Activo' : 'Inactivo' }}</span></td>
        <td><small style="color:#64748b">{{ u.registradoPor || '—' }}</small></td>
        <td style="text-align:right">
          <button class="icon-btn icon-edit" (click)="abrirEditar(u)">✏️</button>
          <button class="icon-btn icon-del" (click)="eliminar(u)">🗑️</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="modal-overlay" *ngIf="mostrarModal" (mousedown)="$event.target === $event.currentTarget ? cerrar() : null">
  <div class="modal" (click)="$event.stopPropagation()">
    <h3>{{ modoEdicion ? 'Editar' : 'Nuevo' }} Usuario</h3>
    <div class="form-group"><label>Nombre</label><input type="text" class="input" [(ngModel)]="form.nombre"></div>
    <div class="form-group"><label>Email</label><input type="email" class="input" [(ngModel)]="form.email"></div>
    <div class="grid-2">
      <div class="form-group">
        <label style="display:flex;justify-content:space-between;align-items:center">
          Rol
          <a href="javascript:void(0)" (click)="nuevoRol()" style="font-weight:600;color:#2b6cb0;font-size:.75rem">＋ Nuevo rol</a>
        </label>
        <select class="select" [(ngModel)]="form.rolId">
          <option [ngValue]="null">Selecciona...</option>
          <option *ngFor="let r of roles" [ngValue]="r.id">{{ r.nombre }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>Estado</label>
        <select class="select" [(ngModel)]="form.activo">
          <option [ngValue]="true">Activo</option>
          <option [ngValue]="false">Inactivo</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Contraseña {{ modoEdicion ? '(dejar en blanco para no cambiar)' : '' }}</label>
      <input type="password" class="input" [(ngModel)]="form.password" placeholder="••••••••">
    </div>
    <div class="modal-actions">
      <button class="btn btn-light" (click)="cerrar()">Cancelar</button>
      <button class="btn btn-primary" (click)="guardar()">Guardar</button>
    </div>
  </div>
</div>
